name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore locked dependencies
        run: dotnet restore UtoAegis.slnx --locked-mode

      - name: Build
        run: dotnet build UtoAegis.slnx --no-restore --configuration Release

      - name: Verify formatting
        run: dotnet format UtoAegis.slnx --verify-no-changes --no-restore

      - name: Test
        run: dotnet test UtoAegis.slnx --no-build --configuration Release

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $hasErrors = $false
          Get-ChildItem scripts -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors) | Out-Null

            foreach ($parseError in $errors) {
              Write-Error "$($_.FullName): $($parseError.Message)"
              $hasErrors = $true
            }
          }

          if ($hasErrors) {
            throw "One or more PowerShell scripts failed to parse."
          }

      - name: Test release metadata integrity
        shell: pwsh
        run: |
          ./tests/release/ReleaseMetadata.Tests.ps1
          ./tests/release/DeploymentPlan.Tests.ps1
          ./tests/release/EnrollmentPackaging.Tests.ps1
          ./tests/release/PortableExecutablePackaging.Tests.ps1
          ./tests/release/RiskScoringPackaging.Tests.ps1

      - name: Test endpoint enrollment lifecycle
        shell: pwsh
        run: ./tests/management/EnrollmentLifecycleScripts.Tests.ps1

      - name: Test authenticated runtime policy
        shell: pwsh
        run: ./tests/runtime-policy/RuntimePolicyScripts.Tests.ps1

      - name: Report vulnerable dependencies
        run: dotnet list UtoAegis.slnx package --vulnerable --include-transitive --no-restore
